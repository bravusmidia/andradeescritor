<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="prata" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#D9DDE2"/><stop offset=".6" stop-color="#8E959E"/><stop offset="1" stop-color="#4B5058"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1BE"/><stop offset=".4" stop-color="#E0B252"/><stop offset=".75" stop-color="#9C6E1E"/><stop offset="1" stop-color="#5E3F0C"/>
    </linearGradient>
    <linearGradient id="preto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A5A5E"/><stop offset=".22" stop-color="#1C1C1F"/><stop offset=".55" stop-color="#050506"/><stop offset=".85" stop-color="#1A1A1D"/><stop offset="1" stop-color="#3A3A3E"/>
    </linearGradient>
  </defs>
  <g transform="translate(1.2 30.8) rotate(-45)">
    <!-- corpo preto brilhante -->
    <rect x="17.2" y="-3.3" width="30" height="6.6" rx="1.2" fill="url(#preto)" stroke="#9A8A6A" stroke-width=".4"/>
    <path d="M18 -2.4 H 46" stroke="#FFFFFF" stroke-opacity=".45" stroke-width=".5" stroke-linecap="round"/>
    <!-- anel dourado largo -->
    <rect x="15.4" y="-3.5" width="2.2" height="7" rx=".5" fill="url(#ouro)" stroke="#4A3208" stroke-width=".25"/>
    <rect x="25.5" y="-3.4" width="1.1" height="6.8" fill="url(#ouro)"/>
    <!-- empunhadura -->
    <path d="M11.2 -2.4 L 15.6 -2.9 L 15.6 2.9 L 11.2 2.4 Z" fill="url(#preto)" stroke="#9A8A6A" stroke-width=".4"/>
    <!-- bico (pena) prateado -->
    <path d="M0 0 C 3 -0.6, 7 -2.4, 11.6 -2.6 L 11.6 2.6 C 7 2.4, 3 0.6, 0 0 Z" fill="url(#prata)" stroke="#2E3238" stroke-width=".3" stroke-linejoin="round"/>
    <!-- detalhe dourado do bico -->
    <path d="M6.2 0 C 7.4 -1.2, 9.4 -1.9, 11.4 -1.9 L 11.4 1.9 C 9.4 1.9, 7.4 1.2, 6.2 0 Z" fill="url(#ouro)" opacity=".9"/>
    <path d="M8.3 -0.9 C 9.3 -1.3, 10.4 -1.3, 11.2 -1.2 M8.3 0.9 C 9.3 1.3, 10.4 1.3, 11.2 1.2" stroke="#6E4C12" stroke-width=".2" fill="none"/>
    <!-- fenda e furo de respiro -->
    <path d="M0.3 0 L 6.6 0" stroke="#1E2126" stroke-width=".35" stroke-linecap="round"/>
    <circle cx="6.9" cy="0" r=".55" fill="#1E2126"/>
    <path d="M1.5 -0.35 L 5.6 -1.1" stroke="#FFFFFF" stroke-opacity=".8" stroke-width=".3" stroke-linecap="round"/>
  </g>
</svg>
